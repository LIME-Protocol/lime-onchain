[package]
name = "lime-vault"
version = "0.1.0"
description = "LIME collateral vault and position accounting"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lime_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
lime-market = { path = "../lime-market", features = ["cpi"] }
